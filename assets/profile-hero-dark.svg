<svg xmlns="http://www.w3.org/2000/svg" width="600" height="215" viewBox="0 0 1200 430" role="img" aria-labelledby="title description">
  <title id="title">Jeff Dorsainvil — Product Engineer and Software Engineer</title>
  <desc id="description">Software should feel simpler than the problem it solves. Product Engineer and Software Engineer.</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="0" x2="1120" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171B24"/>
      <stop offset="0.55" stop-color="#1C202C"/>
      <stop offset="1" stop-color="#222633"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(908 67) rotate(140) scale(420 260)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B7CF6" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#8B7CF6" stop-opacity="0"/>
    </radialGradient>

  </defs>
  <rect x="1" y="1" width="1198" height="428" rx="34" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="428" rx="34" fill="url(#glow)"/>
  <text x="600" y="78" fill="#A1A9B5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="4" text-anchor="middle">JEFF DORSAINVIL</text>
  <text x="600" y="179" fill="#F2F4F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-2.5" text-anchor="middle">Software should feel simpler</text>
  <text x="600" y="253" fill="#F2F4F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-2.5" text-anchor="middle">than the problem it solves.</text>
  <text x="600" y="321" fill="#A1A9B5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="25" font-weight="500" text-anchor="middle">Product Engineer · Software Engineer</text>
</svg>
