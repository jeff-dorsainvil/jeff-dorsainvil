<svg xmlns="http://www.w3.org/2000/svg" width="600" height="65" viewBox="0 0 1200 130" role="img" aria-labelledby="title desc">
  <title id="title">Three principles behind Jeff's product approach</title>
  <desc id="desc">Clarity before code, scale without the rewrite, and shipping to learn.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232323"/>
      <stop offset="1" stop-color="#1C1C1C"/>
    </linearGradient>
  </defs>

  <rect width="384" height="130" rx="20" fill="url(#background)"/>
  <rect x="408" width="384" height="130" rx="20" fill="url(#background)"/>
  <rect x="816" width="384" height="130" rx="20" fill="url(#background)"/>

  <text x="32" y="40" fill="#969696" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20">
    <tspan fill="#F2F2F2" font-weight="700">Clarity before code.</tspan><tspan> Understand</tspan>
    <tspan x="32" dy="27">the real problem before choosing</tspan>
    <tspan x="32" dy="27">the technology.</tspan>
  </text>

  <text x="440" y="40" fill="#969696" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20">
    <tspan fill="#F2F2F2" font-weight="700">Scale without the rewrite.</tspan><tspan> Durable</tspan>
    <tspan x="440" dy="27">models and clear contracts make</tspan>
    <tspan x="440" dy="27">change safer.</tspan>
  </text>

  <text x="848" y="40" fill="#969696" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20">
    <tspan fill="#F2F2F2" font-weight="700">Ship to learn.</tspan><tspan> Focused releases</tspan>
    <tspan x="848" dy="27">create faster feedback without</tspan>
    <tspan x="848" dy="27">wasted complexity.</tspan>
  </text>
</svg>
